<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complex Box Layout with Circles</title>
  <style>
    /* Main container */
    .main-box {
      width: 500px;
      height: 500px;
      display: flex;
      flex-wrap: wrap;
      border: 2px solid black;
    }

    /* Each quadrant */
    .part {
      width: 50%;
      height: 50%;
      box-sizing: border-box;
      border: 1px solid gray;
      position: relative;
    }

    /* Part 1: subdivide into 4 parts */
    .part1 {
      display: flex;
      flex-wrap: wrap;
    }

    .part1 .small-part {
      width: 50%;
      height: 50%;
      border: 1px solid red;
      box-sizing: border-box;
    }

    /* Part 2: one box with a circle inside */
    .part2 .box {
      width: 150px;
      height: 150px;
      background-color: #ccc;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
    }

    .part2 .circle {
      width: 60px;
      height: 60px;
      background-color: blue;
      border-radius: 50%;
    }

    /* Part 3: subdivide into 4 parts with circles */
    .part3 {
      display: flex;
      flex-wrap: wrap;
      padding: 0;
      border: none;
    }

    .part3 .small-part {
      width: 50%;
      height: 50%;
      box-sizing: border-box;
      border: 1px solid green;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .part3 .small-part .circle {
      width: 60px;
      height: 60px;
      background-color: orange;
      border-radius: 50%;
    }

    /* Part 4: subdivide into 2 parts with 2 circles in each */
    .part4 {
      display: flex;
      flex-wrap: wrap;
      padding: 10;
      border: none;
    }

    .part4 .sub-part {
      width: 50%;
      height: 100%;
      box-sizing: border-box;
      border:  solid purple;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .part4 .sub-part .circle {
      width: 40px;
      height: 40px;
      background-color: red;
      border-radius: 50%;
      margin: 10px;
    }

  </style>
</head>
<body>

  <div class="main-box">

    <!-- Part 1 -->
    <div class="part part1">
      <div class="small-part"></div>
      <div class="small-part"></div>
      <div class="small-part"></div>
      <div class="small-part"></div>
    </div>

    <!-- Part 2 -->
    <div class="part part2">
      <div class="box">
        <div class="circle"></div>
      </div>
    </div>

    <!-- Part 3 -->
    <div class="part part3">
      <div class="small-part"><div class="circle"></div></div>
      <div class="small-part"><div class="circle"></div></div>
      <div class="small-part"><div class="circle"></div></div>
      <div class="small-part"><div class="circle"></div></div>
    </div>

    <!-- Part 4: subdivided into 2 parts, each with 2 circles -->
    <div class="part part4">
      <div class="sub-part">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <div class="sub-part">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
    </div>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Slideshow</title>
  <style>
    /* Basic styles */
    #slideshow {
      width: 500px;
      height: 300px;
      margin: auto;
      overflow: hidden;
      position: relative;
    }

    #slideshow img {
      width: 100%;
      height: 100%;
      position: absolute;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    #slideshow img.active {
      opacity: 1;
      position: relative;
    }
  </style>
</head>
<body>

  <div id="slideshow">
    <img src="https://picsum.photos/id/1018/500/300" class="active" />
    <img src="https://picsum.photos/id/1025/500/300" />
    <img src="https://picsum.photos/id/1035/500/300" />
  </div>

  <script>
    const slides = document.querySelectorAll('#slideshow img');
    let current = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    setInterval(nextSlide, 3000); // Change image every 3 seconds
  </script>

</body>
</html>
